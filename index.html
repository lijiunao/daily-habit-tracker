<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日习惯记录</title><style>
:root{--ink:#19241f;--muted:#77827c;--line:#e5ebe7;--bg:#f4f7f4;--green:#20896c;--orange:#db754f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:34px 22px 55px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.logo{font-size:13px;font-weight:800;letter-spacing:.1em}.userbar{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}button{font:inherit;cursor:pointer}.plain{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;color:var(--ink)}h1{font-size:38px;letter-spacing:-.04em;margin:0 0 8px}.lead{color:var(--muted);margin:0 0 25px}.authbox{max-width:430px;background:#fff;border:1px solid var(--line);padding:27px;border-radius:20px;margin:40px auto;box-shadow:0 15px 40px #20382b0c}.authbox h2{margin:0 0 7px}.authbox p{color:var(--muted);font-size:14px}.field{display:block;margin:15px 0;color:var(--muted);font-size:13px}.field input{display:block;width:100%;margin-top:7px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px}.primary{border:0;border-radius:11px;background:var(--ink);color:#fff;padding:12px 16px;font-weight:700}.authbox .primary{width:100%;margin-top:5px}.switch{border:0;background:none;color:var(--green);padding:12px 0 0}.error{color:#bb482d;font-size:13px;min-height:18px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:23px;box-shadow:0 10px 35px #20382b08}.cardtop{display:flex;align-items:center;gap:12px}.icon{height:42px;width:42px;border-radius:13px;display:grid;place-items:center;background:#e8f4ee;font-size:21px}.smoke .icon{background:#fff0e9}.muted{color:var(--muted);font-size:13px}.count{font-size:55px;font-weight:750;letter-spacing:-.06em;margin:17px 0 1px}.count small{font-size:16px;color:var(--muted);letter-spacing:0;margin-left:7px}.progress{height:6px;background:#eff2f0;border-radius:10px;margin:14px 0 18px;overflow:hidden}.fill{height:100%;background:var(--green);width:0}.smoke .fill{background:var(--orange)}.row{display:flex;gap:9px}.add{flex:1;border:0;border-radius:11px;background:var(--ink);color:#fff;padding:12px;font-weight:700}.smoke .add{background:var(--orange)}.undo{border:0;border-radius:11px;background:#f0f3f1;color:#4f5a54;padding:12px}.panel{margin-top:16px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.panel h2{font-size:17px;margin:0}.settings{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:17px;color:var(--muted);font-size:13px}.settings input{width:74px;border:1px solid var(--line);border-radius:8px;padding:8px}.settings button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px}.history{margin-top:16px}.history table{border-collapse:collapse;width:100%;font-size:14px;margin-top:14px}.history th,.history td{text-align:left;border-bottom:1px solid var(--line);padding:11px 6px}.history th{color:var(--muted);font-weight:500}.history tbody tr{cursor:pointer}.history tbody tr:hover{background:#f7faf8}.totals{display:flex;gap:20px;margin-top:15px;color:var(--muted);font-size:13px}.totals b{color:var(--ink)}.notice{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#19241f;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none}.notice.on{opacity:1}.small{font-size:12px;color:#98a29c;line-height:1.6;margin-top:15px}@media(max-width:620px){.wrap{padding:23px 15px 40px}.cards{grid-template-columns:1fr}.card{padding:20px}h1{font-size:31px}.panel{padding:19px}.bar{margin-bottom:26px}.userbar{gap:7px}}
</style></head><body><main class="wrap"><header class="bar"><div class="logo">DAY BY DAY</div><div class="userbar" id="userbar"></div></header><section id="app"></section></main><div id="notice" class="notice"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script>
const app=document.querySelector('#app'),userbar=document.querySelector('#userbar');let me=null,records={},today=new Date().toLocaleDateString('en-CA'),authMode='register',localMode=new URLSearchParams(location.search).get('local')==='1',sharedGroup=null;const $=s=>document.querySelector(s);const hosted=!localMode&&!!(window.HABIT_SUPABASE?.url&&window.HABIT_SUPABASE?.anonKey);const sb=hosted?window.supabase.createClient(window.HABIT_SUPABASE.url,window.HABIT_SUPABASE.anonKey):null;let sbUser=null;function msg(s){let n=$('#notice');n.textContent=s;n.classList.add('on');setTimeout(()=>n.classList.remove('on'),2400)}
async function api(url,options={}){if(!hosted){let r=await fetch(url,{credentials:'same-origin',headers:{'content-type':'application/json',...(options.headers||{})},...options});let b=await r.json();if(!r.ok)throw Error(b.error||'请求失败');return b}const method=options.method||'GET',body=options.body?JSON.parse(options.body):{};const fail=e=>{if(e)throw Error(e.message||'请求失败')};const profile=async()=>{const {data,error}=await sb.from('profiles').select('id,username,goal,start,end').eq('id',sbUser.id).single();fail(error);return data};if(url==='/api/register'){const {data,error}=await sb.auth.signUp({email:body.email,password:body.password,options:{data:{username:body.username}}});fail(error);if(!data.session)return {user:null,needsEmailConfirm:true};sbUser=data.user;return {user:await profile()}}if(url==='/api/login'){const {data,error}=await sb.auth.signInWithPassword({email:body.email,password:body.password});fail(error);sbUser=data.user;return {user:await profile()}}if(url==='/api/logout'){const {error}=await sb.auth.signOut();fail(error);sbUser=null;return {ok:true}}if(url==='/api/me'){const {data,error}=await sb.auth.getSession();fail(error);if(!data.session)throw Error('请先登录');sbUser=data.session.user;return {user:await profile()}}if(url==='/api/records'){const {data,error}=await sb.from('records').select('record_date,water,smoke').eq('user_id',sbUser.id);fail(error);return {records:Object.fromEntries(data.map(r=>[r.record_date,{water:r.water,smoke:r.smoke}]))}}if(url==='/api/group'){const {data,error}=await sb.rpc('group_snapshot');fail(error);return {group:data}}if(url==='/api/group/create'){const {data,error}=await sb.rpc('create_group');fail(error);return {group:data}}if(url==='/api/group/join'){const {data,error}=await sb.rpc('join_group',{p_invite_code:body.inviteCode});fail(error);return {group:data}}if(url==='/api/group/leave'){const {error}=await sb.rpc('leave_group');fail(error);return {ok:true}}if(url.startsWith('/api/records/')&&method==='PUT'){const date=url.slice('/api/records/'.length),{error}=await sb.from('records').upsert({user_id:sbUser.id,record_date:date,water:Number(body.water),smoke:Number(body.smoke)},{onConflict:'user_id,record_date'});fail(error);return {ok:true}}if(url==='/api/settings'&&method==='PUT'){const {data,error}=await sb.from('profiles').update({goal:Number(body.goal),start:body.start,end:body.end}).eq('id',sbUser.id).select('id,username,goal,start,end').single();fail(error);return {user:data}}throw Error('找不到该接口')}
function authView(){userbar.textContent='';const fields=hosted?(authMode==='register'?`<label class="field">邮箱地址<input name="email" type="email" required autocomplete="email"></label><label class="field">显示名称<input name="displayName" minlength="2" maxlength="40" required autocomplete="nickname"></label>`:`<label class="field">邮箱地址<input name="email" type="email" required autocomplete="username"></label>`):`<label class="field">用户名或邮箱<input name="username" minlength="3" maxlength="64" required autocomplete="username"></label>`;app.innerHTML=`<div class="authbox"><h2>${authMode==='register'?'创建你的个人记录':'登录你的个人记录'}</h2><p>每个账号拥有独立记录和历史看板。</p><form id="auth">${fields}<label class="field">密码（至少 8 位）<input name="password" type="password" minlength="8" required autocomplete="${authMode==='register'?'new-password':'current-password'}"></label><div class="error" id="err"></div><button class="primary">${authMode==='register'?'注册并开始':'登录'}</button></form><button class="switch" id="switch">${authMode==='register'?'已有账号？登录':'还没有账号？注册'}</button><div class="small">记录保存在云端账号中；请使用自己能记住的账号密码。</div></div>`;$('#switch').onclick=()=>{authMode=authMode==='register'?'login':'register';authView()};$('#auth').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let b=await api('/api/'+authMode,{method:'POST',body:JSON.stringify(hosted?{email:f.get('email'),username:f.get('displayName')||'',password:f.get('password')}:{username:f.get('username'),password:f.get('password')})});if(b.needsEmailConfirm){authMode='login';authView();$('#err').textContent='注册已提交，请先查收验证邮件，再回来登录。';return}me=b.user;await load()}catch(x){$('#err').textContent=x.message}}}
const fmt=d=>new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date(d+'T12:00:00'));
async function refreshGroup(){if(localMode){sharedGroup=null;return}sharedGroup=(await api('/api/group')).group}
function groupPanel(){
 if(localMode)return '';
 if(!sharedGroup)return `<section class="panel"><div class="panelhead"><h2>和朋友共享记录</h2><span class="muted">默认仅自己可见</span></div><p class="muted" style="line-height:1.7">创建共享小组并把邀请码发给朋友，或输入朋友的邀请码加入。加入后，小组成员可以互相查看彼此的每日记录和历史。</p><div class="row"><button class="primary" id="createGroup">创建共享小组</button></div><form id="joinGroup" class="settings"><label>朋友的邀请码 <input id="inviteCode" maxlength="24" placeholder="输入邀请码" required></label><button>加入小组</button></form><div id="groupError" class="error"></div></section>`;
 const members=sharedGroup.members||[],rows=members.flatMap(m=>Object.entries(m.records||{}).map(([date,r])=>({date,user:m.user.username,water:r.water,smoke:r.smoke}))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30);
 return `<section class="panel"><div class="panelhead"><h2>朋友共享小组</h2><button class="plain" id="leaveGroup">退出小组</button></div><p class="muted" style="line-height:1.7">小组内 ${members.length} 位成员可查看彼此的每日记录与历史。分享此邀请码邀请朋友：<b style="color:var(--green);letter-spacing:.08em">${esc(sharedGroup.inviteCode)}</b></p><div class="totals">${members.map(m=>`<span><b>${esc(m.user.username)}</b> · 喝水 ${Object.values(m.records||{}).reduce((n,r)=>n+r.water,0)} 杯 · 抽烟 ${Object.values(m.records||{}).reduce((n,r)=>n+r.smoke,0)} 根</span>`).join('')}</div>${rows.length?`<table><thead><tr><th>日期</th><th>成员</th><th>喝水</th><th>抽烟</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${fmt(r.date)}</td><td>${esc(r.user)}</td><td>${r.water} 杯</td><td>${r.smoke} 根</td></tr>`).join('')}</tbody></table>`:'<p class="muted">小组成员还没有记录。</p>'}</section>`;
}
function render(){if(!me){authView();return}let r=records[today]||{water:0,smoke:0},dates=Object.keys(records).sort().reverse(),waterTotal=dates.reduce((n,d)=>n+records[d].water,0),smokeTotal=dates.reduce((n,d)=>n+records[d].smoke,0);userbar.innerHTML=localMode?'<span>本机个人记录</span>':`<span>${esc(me.username)}</span><button class="plain" id="logout">退出</button>`;app.innerHTML=`<h1>照顾好今天的自己。</h1><p class="lead">${fmt(today)} · 每一点记录都属于你</p><section class="cards"><article class="card"><div class="cardtop"><span class="icon">💧</span><div><b>喝水</b><div class="muted">今日饮水记录</div></div></div><div class="count">${r.water}<small>杯</small></div><div class="muted">今天已记录 ${r.water} 杯</div><div class="progress"><div class="fill" style="width:${Math.min(100,r.water*10)}%"></div></div><div class="row"><button class="add" data-type="water" data-delta="1">＋ 记一杯水</button><button class="undo" data-type="water" data-delta="-1">撤销</button></div></article><article class="card smoke"><div class="cardtop"><span class="icon">🚬</span><div><b>抽烟</b><div class="muted">每日额度 ${me.goal} 根</div></div></div><div class="count">${r.smoke}<small>根</small></div><div class="muted">${smokeHint(r.smoke)}</div><div class="progress"><div class="fill" style="width:${Math.min(100,r.smoke/me.goal*100)}%"></div></div><div class="row"><button class="add" data-type="smoke" data-delta="1">＋ 记一根烟</button><button class="undo" data-type="smoke" data-delta="-1">撤销</button></div></article></section><section class="panel"><div class="panelhead"><h2>抽烟节奏提醒</h2><button class="plain" id="notify">开启通知</button></div><p class="muted" style="line-height:1.7;margin-bottom:0">每天 ${me.start}–${me.end} 将额度均匀分配。网站打开时按时间提示建议累计额度，超过当前节奏时发出声音和通知。</p><div class="settings"><label>每日额度 <input id="goal" type="number" min="1" max="100" value="${me.goal}"> 根</label><label>开始 <input id="start" type="time" value="${me.start}"></label><label>结束 <input id="end" type="time" value="${me.end}"></label><button id="save">保存设置</button></div><div class="small">浏览器需要允许通知；网页关闭后不会触发定时提醒。</div></section><section class="panel history"><div class="panelhead"><h2>我的历史看板</h2><span class="muted">${dates.length} 天有记录</span></div><div class="totals"><span>累计喝水 <b>${waterTotal} 杯</b></span><span>累计抽烟 <b>${smokeTotal} 根</b></span></div>${dates.length?`<table><thead><tr><th>日期</th><th>喝水</th><th>抽烟</th><th>每日额度</th></tr></thead><tbody>${dates.map(d=>`<tr><td>${fmt(d)}</td><td>${records[d].water} 杯</td><td>${records[d].smoke} 根</td><td>${me.goal} 根</td></tr>`).join('')}</tbody></table>`:'<p class="muted">记录几天后，这里会显示你的个人历史。</p>'}</section>${groupPanel()}`;
if(!localMode)$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});me=null;render()};if(!localMode&&!sharedGroup){$('#createGroup').onclick=createGroup;$('#joinGroup').onsubmit=joinGroup}if(!localMode&&sharedGroup)$('#leaveGroup').onclick=leaveGroup;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>update(b.dataset.type,Number(b.dataset.delta)));$('#save').onclick=saveSettings;$('#notify').onclick=enableNotify;}
function smokeHint(n){let [sh,sm]=me.start.split(':').map(Number),[eh,em]=me.end.split(':').map(Number),now=new Date(),start=sh*60+sm,end=eh*60+em,elapsed=Math.max(0,Math.min(1,(now.getHours()*60+now.getMinutes()-start)/(end-start))),allowed=Math.min(me.goal,Math.floor(elapsed*me.goal)+1);return n>allowed?`比当前建议节奏多 ${n-allowed} 根`:`按当前时间建议累计不超过 ${allowed} 根`}
async function update(type,delta){let r=records[today]||{water:0,smoke:0};r[type]=Math.max(0,r[type]+delta);records[today]=r;try{await api('/api/records/'+today,{method:'PUT',body:JSON.stringify(r)});if(!localMode)await refreshGroup();render()}catch(e){msg(e.message)}}
async function saveSettings(){try{let b=await api('/api/settings',{method:'PUT',body:JSON.stringify({goal:$('#goal').value,start:$('#start').value,end:$('#end').value})});me=b.user;if(!localMode)await refreshGroup();msg('设置已保存');render()}catch(e){msg(e.message)}}
async function createGroup(){try{await api('/api/group/create',{method:'POST'});await refreshGroup();render()}catch(e){msg(e.message)}}
async function joinGroup(e){e.preventDefault();try{await api('/api/group/join',{method:'POST',body:JSON.stringify({inviteCode:$('#inviteCode').value})});await refreshGroup();render()}catch(x){$('#groupError').textContent=x.message}}
async function leaveGroup(){try{await api('/api/group/leave',{method:'POST'});await refreshGroup();render()}catch(e){msg(e.message)}}
async function enableNotify(){if(!('Notification'in window)){msg('浏览器不支持通知');return}let p=await Notification.requestPermission();msg(p==='granted'?'提醒通知已开启':'通知权限未开启')}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let seen=new Set();function alarm(){if(!me)return;let [sh,sm]=me.start.split(':').map(Number),[eh,em]=me.end.split(':').map(Number),n=new Date(),cur=n.getHours()*60+n.getMinutes(),start=sh*60+sm,end=eh*60+em;if(cur<start||cur>end)return;let slot=Math.min(me.goal,Math.floor((cur-start)/(end-start)*me.goal)+1),id=today+':'+slot;if(seen.has(id))return;seen.add(id);let count=(records[today]||{smoke:0}).smoke;if(count!==slot){let text=count<slot?`到今天第 ${slot}/${me.goal} 个时间点，建议累计不超过 ${slot} 根；目前 ${count} 根。`:`目前 ${count} 根，比当前建议节奏多 ${count-slot} 根。`;try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(c.currentTime+.6)}catch{}if(Notification.permission==='granted')new Notification('抽烟节奏提醒',{body:text});msg(text)}}
async function load(){try{let b=await api('/api/records');records=b.records||{};if(!localMode)await refreshGroup();render();alarm()}catch{me=null;render()}}
(async()=>{try{try{me=(await api('/api/me')).user}catch(e){if(!localMode)throw e;me=(await api('/api/local-session',{method:'POST'})).user}await load()}catch{me=null;authView()}})();setInterval(alarm,30000);
</script></body></html>
